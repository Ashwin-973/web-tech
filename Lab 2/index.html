<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Job Application Portal</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">
  <div class="form-box" id="registerBox">
    <h2>Register to Access the Job Application Form</h2>
    <form id="registerForm" novalidate>
      <label for="regName">Name</label>
      <input type="text" id="regName" placeholder="Enter your full name">
      <span class="error" id="errName"></span>

      <label for="regEmail">Email</label>
      <input type="text" id="regEmail" placeholder="Enter your email">
      <span class="error" id="errEmail"></span>

      <label for="regPhone">Phone</label>
      <input type="text" id="regPhone" placeholder="Enter your 10 digit phone number">
      <span class="error" id="errPhone"></span>

      <label for="regPassword">Password</label>
      <div class="password-wrap">
        <input type="password" id="regPassword" placeholder="Enter password">
        <i class="fa-solid fa-eye" onclick="togglePassword('regPassword', this)"></i>
      </div>
      <span class="error" id="errPassword"></span>

      <label for="regConfirmPassword">Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="regConfirmPassword" placeholder="Confirm password">
        <i class="fa-solid fa-eye" onclick="togglePassword('regConfirmPassword', this)"></i>
      </div>
      <span class="error" id="errConfirmPassword"></span>

      <button type="submit">Register</button>
    </form>
  </div>

  <div class="form-box hidden" id="jobBox">
    <h2>Job Application Form</h2>

    <form id="jobForm" novalidate>

      <label for="position">Position</label>
      <select id="position">
        <option value="">-- Select Position --</option>
        <option value="Frontend Developer">Frontend Developer</option>
        <option value="Backend Developer">Backend Developer</option>
        <option value="Full Stack Developer">Full Stack Developer</option>
        <option value="UI/UX Designer">UI/UX Designer</option>
        <option value="QA Tester">QA Tester</option>
      </select>
      <span class="error" id="errPosition"></span>

      <label for="jobLevel">Job Level</label>
      <select id="jobLevel">
        <option value="">-- Select Job Level --</option>
        <option value="Intern">Intern</option>
        <option value="Junior">Junior</option>
        <option value="Mid">Mid</option>
        <option value="Senior">Senior</option>
      </select>
      <span class="error" id="errJobLevel"></span>

      <label for="experience">Experience (in years)</label>
      <input type="number" id="experience" placeholder="Enter years of experience">
      <span class="error" id="errExperience"></span>

      <label for="skills">Skills</label>
      <input type="text" id="skills" placeholder="Eg: HTML, CSS, JavaScript">
      <span class="error" id="errSkills"></span>

      <label for="projects">Describe Your Projects</label>
      <textarea id="projects" rows="5" placeholder="Describe your projects (minimum 50 characters)"></textarea>
      <span class="error" id="errProjects"></span>

      <label for="resume">Resume Upload (PDF or DOCX only)</label>
      <input type="file" id="resume">
      <span class="error" id="errResume"></span>

      <button type="submit">Submit Application</button>
    </form>
  </div>

  <div class="form-box hidden" id="successBox">
    <i class="fa-solid fa-circle-check success-icon"></i>
    <h2>Application Submitted Successfully!</h2>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
